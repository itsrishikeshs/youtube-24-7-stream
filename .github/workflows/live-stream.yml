name: 24-7 YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: youtube-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Download Compilation Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --pattern "compilation.mp4" --repo itsrishikeshs/youtube-24-7-stream

      - name: Broadcast to YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          timeout 18000s ffmpeg -re -stream_loop -1 -i compilation.mp4 -c copy -f flv -flvflags no_duration_filesize "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}" || true

      - name: Trigger Next Relay Cycle
        if: always()
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT}" \
            https://api.github.com/repos/itsrishikeshs/youtube-24-7-stream/actions/workflows/live-stream.yml/dispatches \
            -d '{"ref":"main"}' || true
